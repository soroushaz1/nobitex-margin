name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Run logic tests
        run: npm test

      - name: Build background runner script
        run: npm run build:runner

      - name: Create Android project
        run: |
          npx cap add android
          # notification tap → open app; background runner's local .aar
          node scripts/patch-android.mjs android
          grep -q '.NOTIFICATION_CLICKED' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          grep -B2 -A12 '<activity' android/app/src/main/AndroidManifest.xml

      - name: Build APK signed with the fixed key (so updates install over the old app)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nobitex-margin.apk

      - name: Verify signing key
        run: |
          keytool -exportcert -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -file ks.der
          python3 scripts/check_apk_cert.py nobitex-margin.apk ks.der

      - uses: actions/upload-artifact@v4
        with:
          name: nobitex-margin-apk
          path: nobitex-margin.apk

      - name: Publish as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: nobitex-margin.apk
          make_latest: true
