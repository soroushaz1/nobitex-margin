name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Run logic tests
        run: npm test

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Use the fixed signing key (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nobitex-margin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: nobitex-margin-apk
          path: nobitex-margin.apk

      - name: Publish as a release (easy download on phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: nobitex-margin.apk
          make_latest: true
